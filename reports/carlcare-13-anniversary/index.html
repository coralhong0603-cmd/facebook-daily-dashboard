<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carlcare 13周年 Facebook 活动看板</title>
<style>
:root {
  --bg:#f4f7fc; --card:#fff; --ink:#1f2a37; --muted:#5b6b7c; --line:#e3eaf3;
  --blue:#2f6fed; --blue2:#e8f0fe; --green:#0f9d6e; --orange:#d97706; --red:#c0392b;
  --chip:#eef3fb; --shadow:0 8px 28px rgba(31,58,110,.08);
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif;background:linear-gradient(180deg,#eef3fb,#f7f9fc 240px);color:var(--ink)}
header{padding:22px 20px 8px;max-width:1280px;margin:0 auto}
h1{margin:0 0 6px;font-size:24px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px}
.wrap{max-width:1280px;margin:0 auto;padding:12px 20px 48px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .label{color:var(--muted);font-size:12px}
.kpi .value{font-size:26px;font-weight:700;margin-top:4px}
.kpi .hint{font-size:11px;color:var(--muted);margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.panel h2{margin:0 0 10px;font-size:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{padding:8px 10px;border:1px solid #d5deea;border-radius:10px;background:#fff;font:inherit}
.filters input{min-width:180px;flex:1}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12px;color:#334}
.chip.on{background:var(--blue2);color:var(--blue);font-weight:600}
.chart{display:grid;gap:6px}
.barrow{display:grid;grid-template-columns:88px 1fr 64px;gap:8px;align-items:center}
.barrow .name{font-size:12px;color:#334;text-align:right}
.bartrack{background:#eef2f8;border-radius:999px;height:10px;overflow:hidden}
.barfill{height:100%;background:linear-gradient(90deg,#4b7cf0,#6aa1ff);border-radius:999px}
.barrow .num{font-size:12px;color:var(--muted);text-align:right}
.trend{display:flex;align-items:flex-end;gap:6px;height:110px;margin:8px 8px 48px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;height:100%;position:relative}
.trend .stem{width:100%;max-width:28px;background:#7aa2ff;border-radius:6px 6px 2px 2px;min-height:2px}
.trend .dl{position:absolute;left:50%;top:calc(100% + 12px);font-size:10px;color:var(--muted);transform:translateX(-50%) rotate(-45deg);transform-origin:center top;white-space:nowrap}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:#fff}
.nowrap{white-space:nowrap}
.table-scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.table-scroll.limit{max-height:70vh}
tr:hover td{background:#f7faff}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#eef3fb}
.tag.unlock{background:#e8f0fe;color:#1d4ed8}
.tag.care{background:#e8f8f1;color:#0f9d6e}
.tag.teaser{background:#fff7e8;color:#b45309}
.tag.promo{background:#fde8ef;color:#be185d}
.tag.other{background:#f1f5f9;color:#475569}
.muted{color:var(--muted)}
.small{font-size:12px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.btn{display:inline-block;padding:8px 12px;border-radius:10px;border:1px solid #d5deea;background:#fff;cursor:pointer;font:inherit}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--blue);font-size:12px}
.thumb{max-width:120px;max-height:80px;border-radius:8px;border:1px solid var(--line);object-fit:cover}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
@media (max-width:900px){.two{grid-template-columns:1fr}.barrow{grid-template-columns:72px 1fr 52px}}
.note{background:#fff8e8;border:1px solid #f1e0b5;border-radius:12px;padding:12px 14px;font-size:12px;color:#6b5420;margin:12px 0}
.pill{display:inline-flex;align-items:center;gap:6px}
.empty{padding:24px;text-align:center;color:var(--muted)}
footer{max-width:1280px;margin:0 auto;padding:8px 20px 40px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>

            <th data-k="category">类别</th>

            <th data-k="views">Views</th>
            <th data-k="engagement">互动</th>
            <th data-k="media_type">媒体</th>

        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <div class="panel" id="pendingPanel" style="display:none">

    <div id="pendingBox"></div>
  </div>
</div>

    if(state.date && p.created_date_beijing !== state.date) return false;
    if(q){
      const blob = [p.summary_zh,p.message,p.country,p.country_zh,p.id,p.category,p.category_detail,p.url].join(' ').toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  });
  const sorters = {
    eng_desc:(a,b)=>(b.engagement||0)-(a.engagement||0),
    views_desc:(a,b)=>((b.views==null?-1:b.views)-(a.views==null?-1:a.views)),
    time_desc:(a,b)=> (b.created_time_beijing||'').localeCompare(a.created_time_beijing||''),
    time_asc:(a,b)=> (a.created_time_beijing||'').localeCompare(b.created_time_beijing||''),
  };
  rows.sort(sorters[state.sort] || sorters.eng_desc);
  return rows;
}
function sumViews(rows){
  let s=0, n=0;
  for(const p of rows){ if(p.views!=null){ s+=p.views; n++; } }
  return {sum:s, n, total:rows.length};
}
function renderKpis(rows){
  const sv = sumViews(rows);
  const eng = rows.reduce((a,p)=>a+(p.engagement||0),0);
  const countries = new Set(rows.map(p=>p.country));
  const s = DATA.summary || {};
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">筛选后帖子</div><div class="value">${rows.length}</div><div class="hint">确定相关总数 ${s.confirmed_posts||0}</div></div>
    <div class="kpi"><div class="label">涉及主页</div><div class="value">${countries.size}</div><div class="hint">扫描 ${s.pages_scanned||0} 个主页</div></div>
    <div class="kpi"><div class="label">累计 Views 之和</div><div class="value">${fmt(sv.sum)}</div><div class="hint">有值 ${sv.n}/${sv.total}（非去重触达）</div></div>
    <div class="kpi"><div class="label">互动合计</div><div class="value">${fmt(eng)}</div><div class="hint">反应+评论+分享</div></div>
  `;
}
function renderCountry(rows){
  const map = new Map();
  for(const p of rows){
    const k = p.country_zh || p.country;
    if(!map.has(k)) map.set(k, {name:k, posts:0, views:0, eng:0, views_n:0});
    const o = map.get(k);
    o.posts++; o.eng += (p.engagement||0);
    if(p.views!=null){ o.views += p.views; o.views_n++; }
  }
  const metric = state.sort.startsWith('views') ? 'views' : 'eng';
  const arr = [...map.values()].sort((a,b)=>b[metric]-a[metric]);
  const max = Math.max(1, ...arr.map(x=>x[metric]));
  document.getElementById('countryChart').innerHTML = arr.map(o=>`
    <div class="barrow"><div class="name">${o.name}</div>
      <div class="bartrack"><div class="barfill" style="width:${(o[metric]/max*100).toFixed(1)}%"></div></div>
      <div class="num">${fmt(o[metric])}</div></div>`).join('') || '<div class="empty">无数据</div>';
}
function renderTrend(rows){
  const map = new Map();
  for(const p of rows){
    const d = p.created_date_beijing;
    map.set(d, (map.get(d)||0)+1);
  }
  const dates = [...map.keys()].sort();
  const max = Math.max(1, ...map.values());
  document.getElementById('trendChart').innerHTML = dates.map(d=>{
    const v = map.get(d);
    const h = Math.max(2, Math.round(v/max*100));
    return `<div class="col" title="${d}: ${v}"><div class="stem" style="height:${h}px"></div><div class="dl">${d.slice(5)}</div></div>`;
  }).join('') || '<div class="empty">无数据</div>';
}
function renderTable(rows){
  document.getElementById('countLine').textContent = `共 ${rows.length} 条`;
  const tb = document.getElementById('tbody');
  tb.innerHTML = rows.map(p=>{
    const thumbs = (p.local_images||[]).slice(0,2).map(f=>`<img class="thumb" src="assets/${f}" alt="">`).join(' ');
    return `<tr>
      <td class="small nowrap">${p.created_time_beijing||''}</td>
      <td class="nowrap">${p.country_zh||p.country}</td>
      <td><span class="tag ${catClass(p.category)}">${p.category_detail||p.category||''}</span></td>
      <td>
        <div>${escapeHtml(p.summary_zh||'')}</div>
        <div class="small muted">R${p.reactions||0} · C${p.comments||0} · S${p.shares||0}</div>
        ${thumbs?`<div style="margin-top:6px">${thumbs}</div>`:''}
        <details><summary>原文 / 依据</summary>
          <div class="small" style="white-space:pre-wrap;margin-top:6px">${escapeHtml(p.message||'(无配文)')}</div>
          <div class="small muted" style="margin-top:6px">依据：${escapeHtml((p.evidence||[]).join(' | '))}</div>
          <div class="small muted">Post ID: ${p.id}</div>
          ${p.views_error?`<div class="small muted">Views 错误：${escapeHtml(p.views_error)}</div>`:''}
        </details>
      </td>
      <td class="nowrap">${p.views==null?'<span class="muted">不可用</span>':fmt(p.views)}</td>
      <td class="nowrap"><b>${fmt(p.engagement)}</b></td>
      <td class="small nowrap">${p.media_type||''}${p.is_shared_post?' · 分享帖':''}</td>
      <td class="small nowrap"><a href="${p.url}" target="_blank" rel="noopener">打开</a></td>
    </tr>`;
  }).join('') || '<tr><td colspan="8" class="empty">无匹配帖子</td></tr>';
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fillFilters(){
  const posts = postsBase();
  const COUNTRY_ZH = Object.fromEntries(posts.map(p=>[p.country,p.country_zh]));
  const countries = [...new Set(posts.map(p=>p.country))].sort((a,b)=> (COUNTRY_ZH[a]||a).localeCompare(COUNTRY_ZH[b]||b,'zh'));
  const cats = [...new Set(posts.map(p=>p.category).filter(Boolean))];
  const medias = [...new Set(posts.map(p=>p.media_type).filter(Boolean))];
  const dates = [...new Set(posts.map(p=>p.created_date_beijing))].sort().reverse();
  const selC = document.getElementById('fCountry');
  countries.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=COUNTRY_ZH[c]||c; selC.appendChild(o); });
  const selCat = document.getElementById('fCategory');
  cats.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; selCat.appendChild(o); });
  const selM = document.getElementById('fMedia');
  medias.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; selM.appendChild(o); });
  const selD = document.getElementById('fDate');
  dates.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; selD.appendChild(o); });
}
function renderMeta(){
  const s = DATA.summary || {};
  document.getElementById('metaLine').textContent =
    `数据截止 ${s.fetched_at_beijing||''}（北京时间） · 扫描范围 ${s.scan_since} → ${s.scan_until} · 口径见页底`;
  const participated = (s.participating_countries_zh||[]).join('、') || '—';
  const missing = (s.non_participating_countries_zh||[]).join('、') || '无';
  document.getElementById('partLine').innerHTML =
    `<b>已参与：</b>${participated}<br><b>扫描期内未见确定周年帖：</b>${missing}`;
  document.getElementById('notes').innerHTML = (s.notes_html || s.notes || '').replace(/\n/g,'<br>');
  document.getElementById('footer').textContent = s.methodology || '';
  // pending
  const pend = DATA.pending || [];
  if(pend.length){
    document.getElementById('pendingPanel').style.display='block';
    document.getElementById('pendingBox').innerHTML = `<div class="table-scroll"><table><thead><tr><th>时间</th><th>国家</th><th>摘要/原文摘录</th><th>原因</th><th>链接</th></tr></thead><tbody>`+
      pend.map(p=>`<tr><td class="small nowrap">${p.created_time_beijing}</td><td class="nowrap">${escapeHtml(p.country_zh||'')}</td><td class="small">${escapeHtml((p.summary_zh||p.message||'').slice(0,180))}</td><td class="small">${escapeHtml((p.evidence||[]).join(' | '))}</td><td class="small nowrap"><a href="${p.url}" target="_blank" rel="noopener">打开</a></td></tr>`).join('')+
      `</tbody></table></div>`;
  }
}
function renderAll(){
  const rows = filtered();
  renderKpis(rows); renderCountry(rows); renderTrend(rows); renderTable(rows);
  const chips=[];
  if(state.country) chips.push('国家='+(postsBase().find(p=>p.country===state.country)||{}).country_zh||state.country);
  if(state.category) chips.push('类别='+state.category);
  if(state.media) chips.push('媒体='+state.media);
  if(state.date) chips.push('日期='+state.date);
  if(state.q) chips.push('搜索='+state.q);
  document.getElementById('activeChips').innerHTML = chips.map(c=>`<span class="chip on">${escapeHtml(c)}</span>`).join('') || '<span class="chip">未筛选</span>';
}
function exportCsv(){
  const rows = filtered();
  const cols = ['country','country_zh','id','url','created_time_beijing','category','category_detail','summary_zh','media_type','views','reactions','comments','shares','engagement','message'];
  const esc = v => {
    const s = v==null?'':String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const lines = [cols.join(',')].concat(rows.map(r=>cols.map(c=>esc(r[c])).join(',')));
  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'carlcare_13_anniversary_filtered.csv';
  a.click();
}
function bind(){
  document.getElementById('fCountry').onchange = e=>{ state.country=e.target.value; renderAll(); };
  document.getElementById('fCategory').onchange = e=>{ state.category=e.target.value; renderAll(); };
  document.getElementById('fMedia').onchange = e=>{ state.media=e.target.value; renderAll(); };
  document.getElementById('fDate').onchange = e=>{ state.date=e.target.value; renderAll(); };
  document.getElementById('fSearch').oninput = e=>{ state.q=e.target.value; renderAll(); };
  document.getElementById('fSort').onchange = e=>{ state.sort=e.target.value; renderAll(); };
  document.getElementById('btnExport').onclick = exportCsv;
  document.getElementById('btnReset').onclick = ()=>{
    state.country=state.category=state.media=state.date=state.q=''; state.sort='eng_desc';
    document.getElementById('fCountry').value='';
    document.getElementById('fCategory').value='';
    document.getElementById('fMedia').value='';
    document.getElementById('fDate').value='';
    document.getElementById('fSearch').value='';
    document.getElementById('fSort').value='eng_desc';
    renderAll();
  };
}
fillFilters(); renderMeta(); bind(); renderAll();
</script>
</body>

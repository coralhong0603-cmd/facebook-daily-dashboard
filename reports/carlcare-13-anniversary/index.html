<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carlcare 13周年 Facebook 活动看板</title>
<style>
:root {
  --bg:#f4f7fc; --card:#fff; --ink:#1f2a37; --muted:#5b6b7c; --line:#e3eaf3;
  --blue:#2f6fed; --blue2:#e8f0fe; --green:#0f9d6e; --orange:#d97706; --red:#c0392b;
  --chip:#eef3fb; --shadow:0 8px 28px rgba(31,58,110,.08);
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif;background:linear-gradient(180deg,#eef3fb,#f7f9fc 240px);color:var(--ink)}
header{padding:22px 20px 8px;max-width:1280px;margin:0 auto}
h1{margin:0 0 6px;font-size:24px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px}
.wrap{max-width:1280px;margin:0 auto;padding:12px 20px 48px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .label{color:var(--muted);font-size:12px}
.kpi .value{font-size:26px;font-weight:700;margin-top:4px}
.kpi .hint{font-size:11px;color:var(--muted);margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.panel h2{margin:0 0 10px;font-size:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{padding:8px 10px;border:1px solid #d5deea;border-radius:10px;background:#fff;font:inherit}
.filters input{min-width:180px;flex:1}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12px;color:#334}
.chip.on{background:var(--blue2);color:var(--blue);font-weight:600}
.chart{display:grid;gap:6px}
.barrow{display:grid;grid-template-columns:100px 1fr 72px;gap:6px;align-items:center}
.barrow .name{font-size:12px;color:#334;text-align:right}
.bartrack{background:#eef2f8;border-radius:999px;height:10px;overflow:hidden}
.barfill{height:100%;background:linear-gradient(90deg,#4b7cf0,#6aa1ff);border-radius:999px}
.barrow .num{font-size:12px;color:var(--muted);text-align:right}
.trend{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.trend .stem{width:100%;max-width:28px;background:#7aa2ff;border-radius:6px 6px 2px 2px;min-height:2px}
.trend .dl{font-size:10px;color:var(--muted);transform:rotate(-40deg);white-space:nowrap;margin-top:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:#fff;cursor:pointer;user-select:none}
th:hover{color:var(--blue)}
tr:hover td{background:#f7faff}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#eef3fb}
.tag.unlock{background:#e8f0fe;color:#1d4ed8}
.tag.care{background:#e8f8f1;color:#0f9d6e}
.tag.teaser{background:#fff7e8;color:#b45309}
.tag.promo{background:#fde8ef;color:#be185d}
.tag.other{background:#f1f5f9;color:#475569}
.tag.video{background:#f3e8ff;color:#6d28d9}
.muted{color:var(--muted)}
.small{font-size:12px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.btn{display:inline-block;padding:8px 12px;border-radius:10px;border:1px solid #d5deea;background:#fff;cursor:pointer;font:inherit}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--blue);font-size:12px}
.thumb{max-width:120px;max-height:80px;border-radius:8px;border:1px solid var(--line);object-fit:cover}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
@media (max-width:900px){.two{grid-template-columns:1fr}.barrow{grid-template-columns:72px 1fr 52px}}
.note{background:#fff8e8;border:1px solid #f1e0b5;border-radius:12px;padding:12px 14px;font-size:12px;color:#6b5420;margin:12px 0}
.pill{display:inline-flex;align-items:center;gap:6px}
.empty{padding:24px;text-align:center;color:var(--muted)}
footer{max-width:1280px;margin:0 auto;padding:8px 20px 40px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Carlcare 13周年 Facebook 活动看板</h1>
  <div class="sub" id="metaLine"></div>
</header>
<div class="wrap">
  <div class="note" id="notes"></div>
  <div class="kpis" id="kpis"></div>
  <div class="panel">
    <h2>筛选与搜索</h2>
    <div class="filters">
      <select id="fCountry"><option value="">全部国家</option></select>
      <select id="fCategory"><option value="">全部类别</option></select>
      <select id="fMedia"><option value="">全部媒体类型</option></select>
      <select id="fDate"><option value="">全部日期</option></select>
      <input id="fSearch" placeholder="搜索摘要 / 原文 / 国家 / Post ID">
      <select id="fSort">
        <option value="eng_desc">按互动降序</option>
        <option value="views_desc">按 Views 降序</option>
        <option value="time_desc">按时间最新</option>
        <option value="time_asc">按时间最早</option>
      </select>
      <button class="btn" id="btnExport">导出筛选 CSV</button>
      <button class="btn" id="btnReset">重置</button>
    </div>
    <div class="chiprow" id="activeChips"></div>
  </div>
  <div class="two">
    <div class="panel">
      <h2>国家表现（按当前筛选）</h2>
      <div class="chart" id="countryChart"></div>
    </div>
    <div class="panel">
      <h2>发帖日期趋势</h2>
      <div class="trend" id="trendChart"></div>
      <div class="small muted" style="margin-top:18px" id="partLine"></div>
    </div>
  </div>
  <div class="two">
    <div class="panel">
      <h2>分类分布（按当前筛选）</h2>
      <div class="chart" id="categoryChart"></div>
    </div>
    <div class="panel">
      <h2>国家汇总表（按当前筛选，Views 降序）</h2>
      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>国家</th><th>帖数</th><th>Views</th><th>反应</th><th>评论</th><th>分享</th><th>总互动</th>
            </tr>
          </thead>
          <tbody id="countryTable"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="panel">
    <h2>帖子明细 <span class="muted small" id="countLine"></span></h2>
    <div style="overflow:auto;max-height:70vh">
      <table>
        <thead>
          <tr>
            <th data-k="created_time_beijing">北京时间</th>
            <th data-k="country_zh">国家</th>
            <th data-k="category">类别</th>
            <th data-k="summary_zh">摘要</th>
            <th data-k="views">Views</th>
            <th data-k="engagement">互动</th>
            <th data-k="media_type">媒体</th>
            <th>原帖</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <div class="panel" id="pendingPanel" style="display:none">
    <h2>待确认候选（未计入汇总）</h2>
    <div id="pendingBox"></div>
  </div>
</div>
<footer id="footer"></footer>

  cats.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; selCat.appendChild(o); });
  const selM = document.getElementById('fMedia');
  medias.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; selM.appendChild(o); });
  const selD = document.getElementById('fDate');
  dates.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; selD.appendChild(o); });
}
function renderMeta(){
  const s = DATA.summary || {};
  document.getElementById('metaLine').textContent =
    `数据截止 ${s.fetched_at_beijing||''}（北京时间） · 扫描范围 ${s.scan_since} → ${s.scan_until} · 口径见页底`;
  const participated = (s.participating_countries_zh||[]).join('、') || '—';
  const missing = (s.non_participating_countries_zh||[]).join('、') || '无';
  document.getElementById('partLine').innerHTML =
    `<b>已参与：</b>${participated}<br><b>扫描期内未见确定周年帖：</b>${missing}`;
  document.getElementById('notes').innerHTML = (s.notes_html || s.notes || '').replace(/\n/g,'<br>');
  document.getElementById('footer').textContent = s.methodology || '';
  // pending
  const pend = DATA.pending || [];
  if(pend.length){
    document.getElementById('pendingPanel').style.display='block';
    document.getElementById('pendingBox').innerHTML = `<table><thead><tr><th>时间</th><th>国家</th><th>摘要/原文摘录</th><th>原因</th><th>链接</th></tr></thead><tbody>`+
      pend.map(p=>`<tr><td class="small">${p.created_time_beijing}</td><td>${p.country_zh}</td><td class="small">${escapeHtml((p.summary_zh||p.message||'').slice(0,180))}</td><td class="small">${escapeHtml((p.evidence||[]).join(' | '))}</td><td class="small"><a href="${p.url}" target="_blank" rel="noopener">打开</a></td></tr>`).join('')+
      `</tbody></table>`;
  }
}
function renderAll(){
  const rows = filtered();
  renderKpis(rows); renderCountry(rows); renderCategory(rows); renderTrend(rows); renderTable(rows);
  const chips=[];
  if(state.country) chips.push('国家='+(postsBase().find(p=>p.country===state.country)||{}).country_zh||state.country);
  if(state.category) chips.push('类别='+state.category);
  if(state.media) chips.push('媒体='+state.media);
  if(state.date) chips.push('日期='+state.date);
  if(state.q) chips.push('搜索='+state.q);
  document.getElementById('activeChips').innerHTML = chips.map(c=>`<span class="chip on">${escapeHtml(c)}</span>`).join('') || '<span class="chip">未筛选</span>';
}
function exportCsv(){
  const rows = filtered();
  const cols = ['country','country_zh','id','url','created_time_beijing','category','category_detail','summary_zh','media_type','views','reactions','comments','shares','engagement','message'];
  const esc = v => {
    const s = v==null?'':String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const lines = [cols.join(',')].concat(rows.map(r=>cols.map(c=>esc(r[c])).join(',')));
  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'carlcare_13_anniversary_filtered.csv';
  a.click();
}
function bind(){
  document.getElementById('fCountry').onchange = e=>{ state.country=e.target.value; renderAll(); };
  document.getElementById('fCategory').onchange = e=>{ state.category=e.target.value; renderAll(); };
  document.getElementById('fMedia').onchange = e=>{ state.media=e.target.value; renderAll(); };
  document.getElementById('fDate').onchange = e=>{ state.date=e.target.value; renderAll(); };
  document.getElementById('fSearch').oninput = e=>{ state.q=e.target.value; renderAll(); };
  document.getElementById('fSort').onchange = e=>{ state.sort=e.target.value; renderAll(); };
  document.getElementById('btnExport').onclick = exportCsv;
  document.getElementById('btnReset').onclick = ()=>{
    state.country=state.category=state.media=state.date=state.q=''; state.sort='eng_desc';
    document.getElementById('fCountry').value='';
    document.getElementById('fCategory').value='';
    document.getElementById('fMedia').value='';
    document.getElementById('fDate').value='';
    document.getElementById('fSearch').value='';
    document.getElementById('fSort').value='eng_desc';
    renderAll();
  };
}
fillFilters(); renderMeta(); bind(); renderAll();
</script>
